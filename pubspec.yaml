name: patient
description: "SehatID — Pakistan's Digital Health Card (patient app)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  intl: ^0.20.3
  http: ^1.2.1
  file_picker: ^8.1.4
  image_cropper: ^9.1.0
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
