name: patient
description: "HayaatID - Pakistan's Digital Health Card (patient app)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^18.0.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  http: ^1.2.1
  file_picker: ^8.1.4
  image_cropper: ^9.1.0
  supabase_flutter: ^2.8.0
  pdfrx: ^2.4.4
  url_launcher: ^6.3.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
